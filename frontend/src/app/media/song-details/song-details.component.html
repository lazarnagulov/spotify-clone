<div class="song-detail">
  <div *ngIf="loading" class="loading-container">
    <mat-spinner></mat-spinner>
  </div>

  <mat-card *ngIf="error && !loading" class="error-card">
    <mat-card-content>
      <mat-icon color="warn">error</mat-icon>
      <p>{{ error }}</p>
    </mat-card-content>
  </mat-card>

  <div *ngIf="song && !loading">
    <mat-card class="song-header">
      <div class="header-content">
        <img
          mat-card-image
          [src]="song.cover_url || 'no-image.svg'"
          [alt]="song.title"
          class="cover-image"
        />
        <mat-card-content class="song-info">
          <h1 class="song-title">{{ song.title }}</h1>
          <p class="artists">{{ getArtistsString() }}</p>
          <p class="album-info" *ngIf="song.album">
            <mat-icon>album</mat-icon>
            {{ song.album.title }}
            <span *ngIf="song.album.year">({{ song.album.year }})</span>
            <span *ngIf="song.track_number"> • Track {{ song.track_number }}</span>
          </p>
          <p class="genres" *ngIf="song.genres.length > 0">
            <mat-chip-set>
              <mat-chip *ngFor="let genre of song.genres">{{ genre }}</mat-chip>
            </mat-chip-set>
          </p>
          <p class="description" *ngIf="song.description">
            {{ song.description }}
          </p>
        </mat-card-content>
      </div>

      <mat-card-actions class="player-controls">
        <div class="playback-area">
          <div class="play-button-container">
            <button
              mat-fab
              color="primary"
              (click)="togglePlay()"
              [disabled]="!song.audio_url"
            >
              <mat-icon>{{ isPlaying ? 'pause' : 'play_arrow' }}</mat-icon>
            </button>
          </div>

          <div class="player-info">
            <div class="progress-container">
              <span class="time-label">{{ formatTime(currentTime) }}</span>
              <mat-slider
                class="progress-slider"
                [min]="0"
                [max]="duration"
                (input)="seek($event)"
                [disabled]="!audio"
              >
                <input matSliderThumb>
              </mat-slider>
              <span class="time-label">{{ formatTime(duration) }}</span>
            </div>

            <div class="volume-control">
              <mat-icon>volume_up</mat-icon>
              <mat-slider
                class="volume-slider"
                [min]="0"
                [max]="1"
                [step]="0.01"
                (input)="changeVolume($event)"
              >
                <input matSliderThumb>
              </mat-slider>
            </div>
          </div>
        </div>
      </mat-card-actions>
    </mat-card>

    <section class="related-section" *ngIf="song.related_songs && song.related_songs.length > 0">
      <h2>More by {{ getArtistsString() }}</h2>
      <div class="media-grid">
        <app-media-card
          *ngFor="let related of song.related_songs"
          [id]="related.id"
          [title]="related.title"
          [subtitle]="'Song'"
          [imageUrl]="related.cover_url"
        ></app-media-card>
      </div>
    </section>
  </div>
</div>
