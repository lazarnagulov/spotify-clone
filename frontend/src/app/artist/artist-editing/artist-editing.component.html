<div class="artist-page">
  <h1 class="page-title">
    <mat-icon class="edit-icon">edit</mat-icon>
    Edit Artist Information
  </h1>

  <form [formGroup]="artistForm" (ngSubmit)="onSubmit()" class="artist-form">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Artist Name</mat-label>
      <input matInput formControlName="name" placeholder="Enter artist name">
      <mat-error *ngIf="artistForm.get('name')?.hasError('required')">
        Artist name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Bio</mat-label>
      <textarea matInput formControlName="bio" placeholder="Enter bio" rows="4"></textarea>
      <mat-hint align="end">{{artistForm.get('bio')?.value?.length || 0}} / 500</mat-hint>
      <mat-error *ngIf="artistForm.get('bio')?.hasError('required')">
        Bio is required
      </mat-error>
      <mat-error *ngIf="artistForm.get('bio')?.hasError('minlength')">
        Bio must be at least 10 characters
      </mat-error>
      <mat-error *ngIf="artistForm.get('bio')?.hasError('maxlength')">
        Bio cannot exceed 500 characters
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Genres</mat-label>
      <mat-select formControlName="genres" multiple>
        <mat-option *ngFor="let genre of allGenres" [value]="genre">
          {{ genre }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="artistForm.get('genres')?.hasError('required')">
        At least one genre must be selected
      </mat-error>
    </mat-form-field>

    <button mat-raised-button color="accent" type="submit">
      <mat-icon class="button-icon">edit</mat-icon>
      Save Changes
    </button>
  </form>
</div>
