<section class="discover-hero">
  <div class="hero-inner">
    <span class="discover-icon material-icons" aria-hidden="true">explore</span>
    <h1 class="discover-title">Discover</h1>
  </div>
  <p class="discover-sub">New recommendations and popular — browse by genre</p>
</section>

<section class="genre-select-section">
  <mat-form-field appearance="outline" class="genre-select">
    <mat-label>Select Genre</mat-label>
    <mat-select [(value)]="selectedGenre" (selectionChange)="onGenreChange()">
      <mat-option *ngFor="let genre of genres" [value]="genre">{{ genre }}</mat-option>
    </mat-select>
  </mat-form-field>
</section>

<div class="no-genre" *ngIf="!selectedGenre">
  <p>Select a genre to see recommendations 🎧</p>
</div>

<div *ngIf="selectedGenre">
  <section class="discover-section">
    <h2 class="section-title">Albums</h2>
    <div class="cards-grid">
      <app-media-card
        *ngFor="let album of albums"
        class="media-card"
        [title]="album.title"
        [subtitle]="album.artists.join(', ')"
        [imageUrl]="album.imageUrl"
        [cardType]="'album'">
      </app-media-card>
    </div>
  </section>

  <section class="discover-section">
    <h2 class="section-title">Songs</h2>
    <div class="cards-grid">
      <app-media-card
        *ngFor="let song of songs"
        class="media-card"
        [title]="song.title"
        [subtitle]="song.artists.join(', ')"
        [imageUrl]="song.coverUrl"
        [cardType]="'song'"
        [audioUrl]="song.audioUrl">
      </app-media-card>
    </div>
  </section>

  <section class="discover-section">
    <h2 class="section-title">Artists</h2>
    <div class="artists-grid">
      <mat-card
        *ngFor="let artist of artists"
        class="artist-card"
        (click)="navigateToArtist(artist.id)"
      >
        <mat-card-content>
          <div class="artist-avatar">
            <mat-icon>person</mat-icon>
          </div>
          <h3>{{ artist.name }}</h3>
          <p class="artist-genres" *ngIf="artist.genres && artist.genres.length > 0">
            {{ artist.genres.join(', ') }}
          </p>
        </mat-card-content>
      </mat-card>
    </div>
  </section>
</div>
