<div class="home-screen">
  <div class="media-grid">
    <app-media-card
      *ngFor="let item of mediaItems"
      [cardType]="item.cardType"
      [title]="item.title"
      [subtitle]="item.subtitle"
      [description]="item.description"
      [imageUrl]="item.imageUrl">
    </app-media-card>
  </div>
</div>
